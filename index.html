<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tablero de Control 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #1a1c1f;
      --surface: #212427;
      --card:    #272a2e;
      --border:  #32363b;
      --text:    #dde1e7;
      --muted:   #636870;
      --light:   #c0c4ca;
    }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 36px;
      height: 64px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      animation: slideDown 0.5s ease both;
      flex-shrink: 0;
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-box {
      width: 36px; height: 36px;
      border-radius: 8px;
      background: linear-gradient(135deg, #3a3e44, #52575f);
      display: flex; align-items: center; justify-content: center;
      font-size: 17px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }

    .logo-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 2.5px;
      color: var(--light);
    }

    .logo-sep {
      width: 1px; height: 20px;
      background: var(--border);
      margin: 0 4px;
    }

    .logo-sub {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .live-pill {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 5px 14px;
      border-radius: 50px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.03);
      font-size: 11px;
      color: var(--muted);
    }

    .live-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #6ee7b7;
      animation: blink 2.4s ease infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    .year-tag {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 15px;
      letter-spacing: 2px;
      color: var(--muted);
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 28px 36px 36px;
      gap: 20px;
      animation: fadeUp 0.6s 0.15s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .title-row {
      display: flex;
      align-items: flex-end;
      gap: 16px;
    }

    .page-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 38px;
      letter-spacing: 3px;
      line-height: 1;
      color: var(--text);
      white-space: nowrap;
    }

    .page-title span { color: var(--muted); }

    .divider-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, var(--border), transparent);
      margin-bottom: 8px;
    }

    .timestamp {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      padding-bottom: 6px;
    }

    .report-card {
      flex: 1;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--card);
      box-shadow: 0 24px 64px rgba(0,0,0,0.45);
      display: flex;
      flex-direction: column;
      min-height: 560px;
    }

    .card-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 18px;
      background: rgba(255,255,255,0.025);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .card-dots { display: flex; gap: 7px; }
    .card-dots span { width: 9px; height: 9px; border-radius: 50%; background: #4a4e54; }

    .card-label {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .report-card iframe {
      flex: 1;
      width: 100%;
      border: none;
      display: block;
      min-height: 520px;
    }

    footer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 12px 36px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 1px;
      text-transform: uppercase;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <div class="logo-box">📊</div>
      <div class="logo-name">Tablero de Control</div>
      <div class="logo-sep"></div>
    </div>
    <div class="header-right">
      <div class="year-tag">2026</div>
      <div class="live-pill">
        <span class="live-dot"></span>
        En vivo
      </div>
    </div>
  </header>

  <main>
    <div class="title-row">
      <div class="page-title">ACTOS ADMINISTRATIVOS<span> ATENCION HUMANITARIA</span></div>
      <div class="divider-line"></div>
      <div class="timestamp" id="ts"></div>
    </div>

    <div class="report-card">
      <div class="card-topbar">
        <div class="card-dots">
          <span></span><span></span><span></span>
        </div>
        <div class="card-label">Power BI Report</div>
        <div style="width:24px"></div>
      </div>
      <iframe
        title="Tablero de Control 2026"
        src="https://app.powerbi.com/reportEmbed?reportId=e08813a6-6543-4ee0-b27c-81e6072de541&autoAuth=true&ctid=5964d9f2-aeb6-48d9-a53d-7ab5cb1d07e8"
        allowfullscreen="true">
      </iframe>
    </div>
  </main>

  <footer>
    © 2026 &nbsp;·&nbsp; Tablero de Control &nbsp;·&nbsp; Powered by Power BI
  </footer>

  <script>
    function updateTs() {
      const now = new Date();
      document.getElementById('ts').textContent =
        now.toLocaleDateString('es-CO', { weekday:'short', day:'2-digit', month:'short', year:'numeric' })
        + ' · ' +
        now.toLocaleTimeString('es-CO', { hour:'2-digit', minute:'2-digit' });
    }
    updateTs();
    setInterval(updateTs, 60000);
  </script>

</body>
</html>
